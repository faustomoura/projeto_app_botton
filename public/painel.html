<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Barraca - AC Grafic</title>
  <style>
    :root {
      --primary: #2563eb; --primary-dark: #1d4ed8;
      --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #cbd5e1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { background: var(--primary); color: white; padding: 15px 0; }
    header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 28px; }
    nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: 500; padding: 6px 12px; border-radius: 6px; }
    nav a:hover { background: rgba(255,255,255,0.2); }
    h2 { margin: 30px 0 20px; }

    .pedido-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: flex; gap: 20px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .pedido-imagem { flex-shrink: 0; }
    .pedido-imagem img { width: 150px; height: 150px; object-fit: cover; border-radius: 8px; border: 2px solid var(--border); }
    .pedido-detalhes { flex: 1; min-width: 250px; }
    .pedido-detalhes h3 { color: var(--primary); margin-bottom: 10px; }
    .pedido-detalhes p { margin: 6px 0; font-size: 14px; }
    .pedido-acoes { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
    .pedido-acoes button { padding: 8px 12px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; }
    .btn-layout { background: var(--primary); color: white; }
    .btn-layout:hover { background: var(--primary-dark); }
    .btn-status { background: #f59e0b; color: white; }
    .btn-excluir { background: #ef4444; color: white; }
    .btn-excluir:hover { background: #dc2626; }

    .status { padding: 4px 12px; border-radius: 12px; font-size: 12px; text-transform: uppercase; font-weight: bold; display: inline-block; }
    .status.recebido { background: #fef3c7; color: #92400e; }
    .status.em_producao { background: #dbeafe; color: #1e40af; }
    .status.pronto { background: #d1fae5; color: #065f46; }
    .status.entregue { background: #e2e8f0; color: #475569; }

    .msg-info { padding: 30px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; text-align: center; color: #64748b; }

    /* Modal de layout/produção */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 12px; padding: 24px; max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 16px; color: var(--primary); }
    #canvas-producao { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; }
    .modal-fechar { background: #64748b; color: white; border: none; padding: 8px 16px; border-radius: 6px; margin-top: 16px; cursor: pointer; }

    @media (max-width: 768px) {
      header .container { flex-direction: column; gap: 10px; }
      nav a { margin: 0 5px; }
      .pedido-card { flex-direction: column; align-items: flex-start; }
      .pedido-acoes { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>🎨 AC Grafic</h1>
      <nav>
        <a href="/">Início</a>
        <a href="/carrinho.html">Meus Pedidos</a>
        <a href="/painel.html">Painel da Barraca</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>📋 Pedidos Recebidos</h2>
    <div id="lista-pedidos">
      <p class="msg-info">Carregando pedidos...</p>
    </div>
  </main>

  <!-- Modal de Layout/Produção -->
  <div class="modal-overlay" id="modal-producao">
    <div class="modal">
      <h3>🖼️ Layout de Produção</h3>
      <p id="producao-info" style="margin-bottom: 16px;"></p>
      <canvas id="canvas-producao"></canvas>
      <br>
      <button class="modal-fechar" onclick="fecharModal()">❌ Fechar</button>
    </div>
  </div>

  <script>
    let pedidoAtual = null;

    function getImgSrc(pedido) {
      const img = pedido.imagem || '';
      return img; // já é base64 (data:) ou vazio
    }

    async function carregarPedidos() {
      const div = document.getElementById('lista-pedidos');
      try {
        const res = await fetch('/api/pedidos');
        const pedidos = await res.json();

        if (pedidos.length === 0) {
          div.innerHTML = '<p class="msg-info">Nenhum pedido recebido ainda.</p>';
          return;
        }

        div.innerHTML = pedidos.map(p => `
          <div class="pedido-card">
            <div class="pedido-imagem">
              <img src="${getImgSrc(p)}" alt="${p.produto}" onerror="this.style.display='none'">
            </div>
            <div class="pedido-detalhes">
              <h3>Pedido #${p.id} — ${p.produto}</h3>
              <p><strong>Cliente:</strong> ${p.cliente_nome}</p>
              <p><strong>Telefone:</strong> ${p.cliente_telefone}</p>
              <p><strong>Barraca:</strong> ${p.barraca}</p>
              <p><strong>Formato:</strong> ${p.formato} • <strong>Tamanho:</strong> ${p.tamanho} cm</p>
              <p><strong>Quantidade:</strong> ${p.quantidade}</p>
              <p><strong>Status:</strong> <span class="status ${p.status}">${p.status.replace('_', ' ')}</span></p>
            </div>
            <div class="pedido-acoes">
              <button class="btn-layout" onclick="gerarProducao(${p.id})">🖼️ Gerar Layout</button>
              <button class="btn-status" onclick="avancarStatus(${p.id})">➡️ Avançar Status</button>
              <button class="btn-excluir" onclick="excluirPedido(${p.id})">🗑️ Excluir</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        div.innerHTML = '<p class="msg-info">Erro ao carregar pedidos.</p>';
      }
    }

    async function gerarProducao(id) {
      const res = await fetch('/api/pedidos');
      const pedidos = await res.json();
      pedidoAtual = pedidos.find(p => p.id === id);
      if (!pedidoAtual) return;

      document.getElementById('modal-producao').classList.add('active');
      const info = document.getElementById('producao-info');
      info.innerHTML = `
        <strong>Pedido #${pedidoAtual.id}</strong> — ${pedidoAtual.produto}<br>
        <strong>Cliente:</strong> ${pedidoAtual.cliente_nome} | <strong>Quantidade:</strong> ${pedidoAtual.quantidade}
      `;

      const src = getImgSrc(pedidoAtual);
      if (!src) {
        alert('Pedido sem imagem');
        return;
      }

      const img = new Image();
      img.src = src;
      img.onload = () => desenharLayout(img, pedidoAtual);
      img.onerror = () => alert('Erro ao carregar a imagem do pedido');
    }

    function desenharLayout(img, pedido) {
      const canvas = document.getElementById('canvas-producao');
      const ctx = canvas.getContext('2d');
      const tamanho = 600;
      canvas.width = tamanho;
      canvas.height = tamanho;

      // Fundo
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, tamanho, tamanho);

      // Máscara circular se redondo
      if (pedido.formato === 'redondo') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(tamanho / 2, tamanho / 2, tamanho / 2, 0, Math.PI * 2);
        ctx.clip();
      }

      // Desenha a imagem cobrindo o canvas
      const scale = Math.max(tamanho / img.width, tamanho / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      ctx.drawImage(img, (tamanho - w) / 2, (tamanho - h) / 2, w, h);

      if (pedido.formato === 'redondo') ctx.restore();

      // Linha de corte
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 5]);
      if (pedido.formato === 'redondo') {
        ctx.beginPath();
        ctx.arc(tamanho / 2, tamanho / 2, tamanho / 2 - 3, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.strokeRect(3, 3, tamanho - 6, tamanho - 6);
      }
      ctx.setLineDash([]);
    }

    function fecharModal() {
      document.getElementById('modal-producao').classList.remove('active');
    }

    async function avancarStatus(id) {
      const ordem = ['recebido', 'em_producao', 'pronto', 'entregue'];
      const res = await fetch('/api/pedidos');
      const pedidos = await res.json();
      const pedido = pedidos.find(p => p.id === id);
      if (!pedido) return;
      const idx = ordem.indexOf(pedido.status);
      const novo = idx >= 0 && idx < ordem.length - 1 ? ordem[idx + 1] : ordem[idx];
      await fetch(`/api/pedidos/${id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: novo })
      });
      carregarPedidos();
    }

    async function excluirPedido(id) {
      if (!confirm('Excluir este pedido?')) return;
      await fetch(`/api/pedidos/${id}`, { method: 'DELETE' });
      carregarPedidos();
    }

    carregarPedidos();
  </script>
</body>
</html>
