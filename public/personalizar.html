<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalizar - AC Grafic</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --danger: #dc2626;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    header { background: var(--primary); color: white; padding: 15px 0; }
    header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 28px; }
    nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: 500; padding: 6px 12px; border-radius: 6px; }
    nav a:hover { background: rgba(255,255,255,0.2); }

    h2 { margin: 30px 0 20px; color: var(--text); }

    .editor {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 30px;
      align-items: start;
    }

    .canvas-area {
      background: #e2e8f0;
      min-height: 500px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      position: relative;
    }

    .moldura {
      width: 350px;
      height: 350px;
      overflow: hidden;
      position: relative;
      background: #fff;
      border: 4px dashed #2563eb;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .moldura:active { cursor: grabbing; }

    .moldura.redondo { border-radius: 50%; }
    .moldura.quadrado { border-radius: 12px; }

    .moldura img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      transform-origin: center center;
    }

    .editor-hint {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: none;
    }

    .controles {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controles label {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
    }

    .controles input, .controles select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      width: 100%;
      margin-top: 10px;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-reset {
      background: #64748b;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }

    .btn-reset:hover { background: #475569; }

    @media (max-width: 768px) {
      .editor { grid-template-columns: 1fr; }
      header .container { flex-direction: column; gap: 10px; }
      nav a { margin: 0 5px; }
      .moldura { width: 280px; height: 280px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>🎨 AC Grafic</h1>
      <nav>
        <a href="/">Início</a>
        <a href="/carrinho.html">Meus Pedidos</a>
        <a href="/painel.html">Painel da Barraca</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2 id="titulo-produto">Personalizar</h2>

    <div class="editor">
      <div class="canvas-area">
        <div id="moldura" class="moldura redondo">
          <img id="preview-img" src="" alt="Pré-visualização">
        </div>
        <div class="editor-hint">🖱️ Arraste para posicionar • Scroll para zoom</div>
      </div>

      <div class="controles">
        <label>📤 Enviar imagem:</label>
        <input type="file" id="upload" accept="image/*">

        <label>📐 Formato:</label>
        <select id="formato">
          <option value="redondo">Redondo</option>
          <option value="quadrado">Quadrado</option>
        </select>

        <label>📏 Tamanho:</label>
        <select id="tamanho">
          <option value="3x3">3,0 cm</option>
          <option value="3.5x3.5">3,5 cm</option>
          <option value="4x4">4,0 cm</option>
          <option value="5x5">5,0 cm</option>
        </select>

        <label>🔢 Quantidade:</label>
        <input type="number" id="quantidade" value="1" min="1">

        <label>🏪 Selecione a barraca:</label>
        <select id="barraca">
          <option value="Barraca 1">Barraca 1</option>
          <option value="Barraca 2">Barraca 2</option>
          <option value="Barraca 3">Barraca 3</option>
        </select>

        <label>👤 Seu nome:</label>
        <input type="text" id="cliente_nome" placeholder="Nome completo">

        <label>📱 Telefone:</label>
        <input type="text" id="cliente_telefone" placeholder="(XX) XXXXX-XXXX">

        <label>🔍 Zoom:</label>
        <input type="range" id="zoom-slider" min="0.3" max="5" step="0.1" value="1">

        <button id="btn-reset" class="btn-reset">🔄 Resetar Posição</button>

        <button id="btn-finalizar" class="btn-primary">✅ Finalizar Pedido</button>
      </div>
    </div>
  </main>

  <script src="/js/editor.js?v=2"></script>
</body>
</html>
