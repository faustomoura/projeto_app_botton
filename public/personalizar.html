<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalizar Botton - AC Grafic</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { background: var(--primary); color: white; padding: 15px 0; }
    header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 28px; }
    nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: 500; padding: 6px 12px; border-radius: 6px; }
    nav a:hover { background: rgba(255,255,255,0.2); }
    h2 { margin: 30px 0 20px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    .card h3 { margin-bottom: 16px; color: var(--text); font-size: 18px; }

    .preview-area { display: flex; gap: 24px; flex-wrap: wrap; }
    .preview-moldura { flex-shrink: 0; display: flex; justify-content: center; align-items: center; }
    .preview-moldura.redondo { width: 300px; height: 300px; border-radius: 50%; background: #e2e8f0; overflow: hidden; border: 3px solid var(--border); }
    .preview-moldura.quadrado { width: 300px; height: 300px; border-radius: 12px; background: #e2e8f0; overflow: hidden; border: 3px solid var(--border); }
    .preview-moldura img { width: 100%; height: 100%; object-fit: cover; }

    .controles { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 16px; }
    .controles label { font-weight: 600; font-size: 14px; color: var(--text); }
    .controles input[type="file"] { padding: 8px; border: 1px solid var(--border); border-radius: 6px; width: 100%; }
    .controles input[type="range"] { width: 100%; }
    .zoom-label { font-size: 13px; color: #64748b; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-weight: 600; font-size: 14px; }
    .form-group input, .form-group select { padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); }

    .botoes-acao { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
    .btn { padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-primary { background: #10b981; color: white; }
    .btn-primary:hover { background: #059669; }
    .btn-secondary { background: var(--primary); color: white; }
    .btn-secondary:hover { background: var(--primary-dark); }

    @media (max-width: 768px) {
      header .container { flex-direction: column; gap: 10px; }
      nav a { margin: 0 5px; }
      .form-grid { grid-template-columns: 1fr; }
      .preview-area { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>🎨 AC Grafic</h1>
      <nav>
        <a href="/">Início</a>
        <a href="/carrinho.html">Meus Pedidos</a>
        <a href="/painel.html">Painel da Barraca</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>🎨 Personalizar Botton</h2>

    <div class="card">
      <h3>🖼️ Sua Imagem</h3>
      <div class="preview-area">
        <div class="preview-moldura redondo" id="preview-moldura">
          <img id="preview-img" src="" alt="Prévia" style="display:none;">
        </div>
        <div class="controles">
          <div>
            <label>📷 Escolher Imagem</label>
            <input type="file" id="input-imagem" accept="image/*">
          </div>
          <div>
            <label>🔍 Zoom: <span id="zoom-valor">100</span>%</label>
            <input type="range" id="zoom-range" min="50" max="400" value="100">
          </div>
          <button class="btn btn-secondary" onclick="resetarZoom()" style="width:fit-content;">🔄 Resetar</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>📝 Detalhes do Pedido</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Nome do Cliente *</label>
          <input type="text" id="cliente-nome" placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label>Telefone *</label>
          <input type="text" id="cliente-telefone" placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
          <label>Barraca</label>
          <select id="barraca">
            <option value="Barraca 1">Barraca 1</option>
            <option value="Barraca 2">Barraca 2</option>
            <option value="Barraca 3">Barraca 3</option>
          </select>
        </div>
        <div class="form-group">
          <label>Produto</label>
          <select id="produto">
            <option value="Botton Redondo">Botton Redondo</option>
            <option value="Botton Quadrado">Botton Quadrado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Formato</label>
          <select id="formato">
            <option value="redondo">Redondo</option>
            <option value="quadrado">Quadrado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tamanho</label>
          <select id="tamanho">
            <option value="3,5x3,5">3,5x3,5 cm</option>
            <option value="5x5">5x5 cm</option>
            <option value="7x7">7x7 cm</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Quantidade</label>
          <input type="number" id="quantidade" value="1" min="1">
        </div>
      </div>
      <div class="botoes-acao">
        <button class="btn btn-primary" onclick="finalizarPedido(true)">🛒 Finalizar e Continuar Comprando</button>
        <button class="btn btn-secondary" onclick="finalizarPedido(false)">✅ Finalizar Pedido</button>
      </div>
    </div>
  </main>

  <script>
    const inputImagem = document.getElementById('input-imagem');
    const previewImg = document.getElementById('preview-img');
    const previewMoldura = document.getElementById('preview-moldura');
    const zoomRange = document.getElementById('zoom-range');
    const zoomValor = document.getElementById('zoom-valor');
    const produtoSelect = document.getElementById('produto');
    const formatoSelect = document.getElementById('formato');
    const tamanhoSelect = document.getElementById('tamanho');

    let imagemBase64 = '';
    let zoomAtual = 100;

    // Troca de produto → ajusta formato e tamanho automaticamente
    produtoSelect.addEventListener('change', function() {
      if (this.value === 'Botton Quadrado') {
        formatoSelect.value = 'quadrado';
        tamanhoSelect.value = '5x5';
        previewMoldura.className = 'preview-moldura quadrado';
      } else {
        formatoSelect.value = 'redondo';
        tamanhoSelect.value = '3,5x3,5';
        previewMoldura.className = 'preview-moldura redondo';
      }
    });

    inputImagem.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        imagemBase64 = ev.target.result;
        previewImg.src = imagemBase64;
        previewImg.style.display = 'block';
        aplicarZoom();
      };
      reader.readAsDataURL(file);
    });

    zoomRange.addEventListener('input', function() {
      zoomAtual = parseInt(this.value);
      zoomValor.textContent = zoomAtual;
      aplicarZoom();
    });

    function aplicarZoom() {
      const scale = zoomAtual / 100;
      previewImg.style.transform = `scale(${scale})`;
      previewImg.style.transformOrigin = 'center center';
    }

    function resetarZoom() {
      zoomAtual = 100;
      zoomRange.value = 100;
      zoomValor.textContent = '100';
      aplicarZoom();
    }

    async function finalizarPedido(continuar) {
      const nome = document.getElementById('cliente-nome').value.trim();
      const telefone = document.getElementById('cliente-telefone').value.trim();
      const barraca = document.getElementById('barraca').value;
      const produto = produtoSelect.value;
      const formato = formatoSelect.value;
      const tamanho = tamanhoSelect.value;
      const quantidade = document.getElementById('quantidade').value;

      if (!nome || !telefone) {
        alert('Preencha nome e telefone.');
        return;
      }
      if (!imagemBase64) {
        alert('Selecione uma imagem.');
        return;
      }

      const pedido = {
        cliente_nome: nome,
        cliente_telefone: telefone,
        barraca,
        produto,
        formato,
        tamanho,
        quantidade: parseInt(quantidade),
        imagem: imagemBase64,
        status: 'recebido'
      };

      try {
        const res = await fetch('/api/pedidos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pedido)
        });
        if (!res.ok) throw new Error('Erro ao salvar');
        alert('Pedido enviado com sucesso!');
        if (!continuar) {
          window.location.href = '/carrinho.html';
        } else {
          // Limpa para novo pedido
          inputImagem.value = '';
          previewImg.style.display = 'none';
          imagemBase64 = '';
          resetarZoom();
          document.getElementById('cliente-nome').value = '';
          document.getElementById('cliente-telefone').value = '';
          document.getElementById('quantidade').value = '1';
        }
      } catch (err) {
        alert('Erro ao enviar pedido: ' + err.message);
      }
    }
  </script>
</body>
</html>
