<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalizar Botton - AC Grafic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f8fafc; color: #1e293b; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { background: #2563eb; color: white; padding: 15px 0; }
    header .container { display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 28px; }
    nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: 500; }
    nav a:hover { text-decoration: underline; }
    h2 { margin: 30px 0 20px; }

    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .preview-area { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
    .preview-box { flex: 1; min-width: 300px; display: flex; justify-content: center; align-items: center; padding: 20px; background: #f1f5f9; border-radius: 8px; }
    .preview-moldura { background: #e2e8f0; padding: 20px; display: flex; justify-content: center; align-items: center; }
    .preview-moldura.redondo { border-radius: 50%; }
    .preview-moldura.quadrado { border-radius: 12px; }
    .preview-moldura img { max-width: 250px; max-height: 250px; object-fit: cover; }
    .preview-moldura.redondo img { border-radius: 50%; }
    .preview-moldura.quadrado img { border-radius: 12px; }

    .controls { flex: 1; min-width: 300px; }
    .controls label { display: block; margin: 15px 0 8px; font-weight: 500; }
    .controls input[type="file"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .controls input[type="range"] { width: 100%; margin: 10px 0; }
    .zoom-label { font-size: 14px; color: #64748b; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { margin-bottom: 8px; font-weight: 500; }
    .form-group input, .form-group select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #2563eb; }

    .btn-group { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }
    .btn-secondary { background: #64748b; color: white; }
    .btn-secondary:hover { background: #475569; }

    @media (max-width: 768px) {
      header .container { flex-direction: column; gap: 10px; }
      nav a { margin: 0 10px; }
      .preview-area { flex-direction: column; }
      .btn-group { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>🎨 AC Grafic</h1>
      <nav>
        <a href="/">Início</a>
        <a href="/carrinho.html">Meus Pedidos</a>
        <a href="/painel.html">Painel da Barraca</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>🎨 Personalizar Botton</h2>

    <div class="card">
      <div class="preview-area">
        <div class="preview-box">
          <div class="preview-moldura redondo" id="preview-moldura">
            <img id="preview-img" src="" alt="Preview" style="display: none;">
          </div>
        </div>
        <div class="controls">
          <label>📷 Escolher Imagem</label>
          <input type="file" id="file-input" accept="image/*">
          
          <label class="zoom-label">🔍 Zoom: <span id="zoom-value">100</span>%</label>
          <input type="range" id="zoom-slider" min="50" max="300" value="100">
          
          <button class="btn btn-secondary" onclick="resetarZoom()" style="margin-top: 15px;">🔄 Resetar</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>📝 Detalhes do Pedido</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Nome do Cliente *</label>
          <input type="text" id="cliente-nome" placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label>Telefone *</label>
          <input type="tel" id="cliente-telefone" placeholder="(00) 00000-0000">
        </div>
        <div class="form-group">
          <label>Barraca</label>
          <select id="barraca">
            <option value="Barraca 1">Barraca 1</option>
            <option value="Barraca 2">Barraca 2</option>
          </select>
        </div>
        <div class="form-group">
          <label>Produto</label>
          <select id="produto">
            <option value="Botton Redondo">Botton Redondo</option>
            <option value="Botton Quadrado">Botton Quadrado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Formato</label>
          <select id="formato">
            <option value="redondo">Redondo</option>
            <option value="quadrado">Quadrado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tamanho</label>
          <select id="tamanho">
            <option value="3,5x3,5 cm">3,5x3,5 cm</option>
            <option value="5x5 cm">5x5 cm</option>
          </select>
        </div>
        <div class="form-group" style="grid-column: 1 / -1;">
          <label>Quantidade</label>
          <input type="number" id="quantidade" value="1" min="1">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="finalizarPedido(true)">🛒 Finalizar e Continuar Comprando</button>
        <button class="btn btn-primary" onclick="finalizarPedido(false)">✅ Finalizar Pedido</button>
      </div>
    </div>
  </main>

  <script>
    let imagemBase64 = '';
    let zoomAtual = 100;

    // Configuração automática ao trocar produto
    const produtoSelect = document.getElementById('produto');
    const formatoSelect = document.getElementById('formato');
    const tamanhoSelect = document.getElementById('tamanho');
    const previewMoldura = document.getElementById('preview-moldura');

    produtoSelect.addEventListener('change', function() {
      if (this.value === 'Botton Quadrado') {
        formatoSelect.value = 'quadrado';
        tamanhoSelect.value = '5x5 cm';
        previewMoldura.className = 'preview-moldura quadrado';
      } else if (this.value === 'Botton Redondo') {
        formatoSelect.value = 'redondo';
        tamanhoSelect.value = '3,5x3,5 cm';
        previewMoldura.className = 'preview-moldura redondo';
      }
    });

    // Upload de imagem
    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          imagemBase64 = event.target.result;
          const img = document.getElementById('preview-img');
          img.src = imagemBase64;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    // Zoom
    document.getElementById('zoom-slider').addEventListener('input', function() {
      zoomAtual = this.value;
      document.getElementById('zoom-value').textContent = zoomAtual;
      const img = document.getElementById('preview-img');
      img.style.transform = `scale(${zoomAtual / 100})`;
    });

    function resetarZoom() {
      zoomAtual = 100;
      document.getElementById('zoom-slider').value = 100;
      document.getElementById('zoom-value').textContent = 100;
      const img = document.getElementById('preview-img');
      img.style.transform = 'scale(1)';
    }

    async function finalizarPedido(continuar) {
      const nome = document.getElementById('cliente-nome').value.trim();
      const telefone = document.getElementById('cliente-telefone').value.trim();
      
      if (!nome || !telefone) {
        alert('Preencha nome e telefone');
        return;
      }

      const pedido = {
        cliente_nome: nome,
        cliente_telefone: telefone,
        barraca: document.getElementById('barraca').value,
        produto: document.getElementById('produto').value,
        formato: document.getElementById('formato').value,
        tamanho: document.getElementById('tamanho').value,
        quantidade: parseInt(document.getElementById('quantidade').value),
        imagem: imagemBase64
      };

      try {
        const res = await fetch('/api/pedidos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pedido)
        });

        if (res.ok) {
          alert('Pedido enviado com sucesso!');
          if (!continuar) {
            window.location.href = '/carrinho.html';
          } else {
            // Limpa formulário
            document.getElementById('cliente-nome').value = '';
            document.getElementById('cliente-telefone').value = '';
            document.getElementById('quantidade').value = '1';
            document.getElementById('file-input').value = '';
            document.getElementById('preview-img').style.display = 'none';
            imagemBase64 = '';
          }
        } else {
          alert('Erro ao enviar pedido');
        }
      } catch (err) {
        alert('Erro de conexão');
      }
    }
  </script>
</body>
</html>
