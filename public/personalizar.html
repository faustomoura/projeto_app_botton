<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalizar Botton - AC Grafic</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }

    header { background: var(--primary); color: white; padding: 15px 0; }
    header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 28px; }
    nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: 500; padding: 6px 12px; border-radius: 6px; }
    nav a:hover { background: rgba(255,255,255,0.2); }

    h2 { margin: 30px 0 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
    input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 16px; }
    button:hover { background: var(--primary-dark); }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }

    .editor-area { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 20px; }
    .moldura { width: 350px; height: 350px; background: #e2e8f0; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; touch-action: none; cursor: grab; flex-shrink: 0; }
    .moldura.redondo { border-radius: 50%; }
    .moldura.quadrado { border-radius: 12px; }
    .moldura img { width: 100%; height: 100%; object-fit: contain; user-select: none; pointer-events: none; }
    .editor-controles { flex: 1; min-width: 280px; }
    .botao-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

    @media (max-width: 768px) {
      header .container { flex-direction: column; gap: 10px; }
      nav a { margin: 0 5px; }
      .form-grid { grid-template-columns: 1fr; }
      .editor-area { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>🎨 AC Grafic</h1>
      <nav>
        <a href="/">Início</a>
        <a href="/carrinho.html">Meus Pedidos</a>
        <a href="/painel.html">Painel da Barraca</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>🧑‍🎨 Personalizar Botton</h2>

    <div class="card">
      <div class="editor-area">
        <div class="moldura redondo" id="moldura">
          <img id="preview-img" alt="Pré-visualização" style="display: none;">
        </div>
        <div class="editor-controles">
          <h3 style="margin-bottom: 12px;">📷 Sua Imagem</h3>
          <input type="file" id="upload" accept="image/*">
          <div style="margin: 16px 0;">
            <label for="zoom-slider">🔍 Zoom: <span id="zoom-valor">100%</span></label>
            <input type="range" id="zoom-slider" min="0.3" max="5" step="0.1" value="1" style="width: 100%;">
          </div>
          <div class="botao-row">
            <button type="button" class="btn-secondary" id="btn-reset">🔄 Resetar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 16px;">📝 Detalhes do Pedido</h3>
      <div class="form-grid">
        <div>
          <label for="cliente_nome">Nome do Cliente *</label>
          <input type="text" id="cliente_nome" placeholder="Ex.: Maria Silva">
        </div>
        <div>
          <label for="cliente_telefone">Telefone *</label>
          <input type="text" id="cliente_telefone" placeholder="Ex.: 16999999999">
        </div>
        <div>
          <label for="barraca">Barraca</label>
          <select id="barraca">
            <option value="Barraca 1">Barraca 1</option>
            <option value="Barraca 2">Barraca 2</option>
            <option value="Barraca 3">Barraca 3</option>
          </select>
        </div>
        <div>
          <label for="produto">Produto</label>
          <select id="produto-select">
            <option value="Botton Redondo">Botton Redondo</option>
            <option value="Botton Quadrado">Botton Quadrado</option>
          </select>
        </div>
        <div>
          <label for="formato">Formato</label>
          <select id="formato">
            <option value="redondo">Redondo</option>
            <option value="quadrado">Quadrado</option>
          </select>
        </div>
        <div>
          <label for="tamanho">Tamanho</label>
          <select id="tamanho">
            <option value="3x3">3x3 cm</option>
            <option value="3.5x3.5">3,5x3,5 cm</option>
            <option value="4x4">4x4 cm</option>
            <option value="5x5">5x5 cm</option>
          </select>
        </div>
        <div class="full">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" min="1" value="1">
        </div>
      </div>
      <div class="botao-row" style="margin-top: 24px;">
        <button id="btn-continuar" style="background: #10b981;">🛒 Finalizar e Continuar Comprando</button>
        <button id="btn-finalizar">✅ Finalizar Pedido</button>
      </div>
    </div>
  </main>

  <script>
    const upload = document.getElementById('upload');
    const previewImg = document.getElementById('preview-img');
    const formato = document.getElementById('formato');
    const moldura = document.getElementById('moldura');
    const btnFinalizar = document.getElementById('btn-finalizar');
    const btnReset = document.getElementById('btn-reset');
    const zoomSlider = document.getElementById('zoom-slider');
    const zoomValor = document.getElementById('zoom-valor');

    let imageState = { x: 0, y: 0, scale: 1, isDragging: false, startX: 0, startY: 0 };
    let imagemOriginal = null;
    let imagemBase64 = null;

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        imagemBase64 = event.target.result; // salva o base64
        const img = new Image();
        img.onload = () => {
          imagemOriginal = img;
          previewImg.src = event.target.result;
          previewImg.style.display = 'block';
          imageState = { x: 0, y: 0, scale: 1, isDragging: false, startX: 0, startY: 0 };
          zoomSlider.value = 1;
          atualizarTransform();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function atualizarTransform() {
      previewImg.style.transform = `translate(${imageState.x}px, ${imageState.y}px) scale(${imageState.scale})`;
      zoomValor.innerText = Math.round(imageState.scale * 100) + '%';
    }

    // DRAG - Mouse
    moldura.addEventListener('mousedown', (e) => {
      if (!previewImg.src) return;
      imageState.isDragging = true;
      imageState.startX = e.clientX - imageState.x;
      imageState.startY = e.clientY - imageState.y;
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!imageState.isDragging) return;
      imageState.x = e.clientX - imageState.startX;
      imageState.y = e.clientY - imageState.startY;
      atualizarTransform();
    });
    document.addEventListener('mouseup', () => { imageState.isDragging = false; });

    // DRAG - Touch
    moldura.addEventListener('touchstart', (e) => {
      if (!previewImg.src || e.touches.length !== 1) return;
      const touch = e.touches[0];
      imageState.isDragging = true;
      imageState.startX = touch.clientX - imageState.x;
      imageState.startY = touch.clientY - imageState.y;
    }, { passive: true });
    moldura.addEventListener('touchmove', (e) => {
      if (!imageState.isDragging || e.touches.length !== 1) return;
      const touch = e.touches[0];
      imageState.x = touch.clientX - imageState.startX;
      imageState.y = touch.clientY - imageState.startY;
      atualizarTransform();
    }, { passive: true });
    moldura.addEventListener('touchend', () => { imageState.isDragging = false; });

    // ZOOM - Scroll
    moldura.addEventListener('wheel', (e) => {
      if (!previewImg.src) return;
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      imageState.scale = Math.max(0.3, Math.min(5, imageState.scale + delta));
      zoomSlider.value = imageState.scale;
      atualizarTransform();
    }, { passive: false });
    zoomSlider.addEventListener('input', (e) => {
      imageState.scale = parseFloat(e.target.value);
      atualizarTransform();
    });

    btnReset.addEventListener('click', () => {
      imageState.x = 0; imageState.y = 0; imageState.scale = 1;
      zoomSlider.value = 1;
      atualizarTransform();
    });

    formato.addEventListener('change', () => {
      moldura.classList.remove('redondo', 'quadrado');
      moldura.classList.add(formato.value);
    });

    // Quando o usuário troca o produto, ajusta Formato e Tamanho automaticamente
    document.getElementById('produto-select').addEventListener('change', (e) => {
      const produtoSel = e.target.value;
      if (produtoSel.includes('Quadrado')) {
        formato.value = 'quadrado';
        document.getElementById('tamanho').value = '5x5';
      } else {
        formato.value = 'redondo';
        document.getElementById('tamanho').value = '3.5x3.5';
      }
      moldura.classList.remove('redondo', 'quadrado');
      moldura.classList.add(formato.value);
    });

    // Recorta a imagem no canvas e retorna data URL (base64)
    function recortarImagem() {
      return new Promise((resolve, reject) => {
        if (!imagemOriginal) { reject(new Error('Nenhuma imagem carregada')); return; }

        const tamanhos = { '3x3': 354, '3.5x3.5': 413, '4x4': 472, '5x5': 591 };
        const tamanhoFinal = tamanhos[document.getElementById('tamanho').value] || 354;
        const formatoSelecionado = formato.value;
        const MOLDURA = 350;
        const img = imagemOriginal;

        const scaleToFit = Math.min(MOLDURA / img.width, MOLDURA / img.height);
        const displayW = img.width * scaleToFit;
        const displayH = img.height * scaleToFit;

        const canvas = document.createElement('canvas');
        canvas.width = tamanhoFinal;
        canvas.height = tamanhoFinal;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, tamanhoFinal, tamanhoFinal);

        if (formatoSelecionado === 'redondo') {
          ctx.save();
          ctx.beginPath();
          ctx.arc(tamanhoFinal / 2, tamanhoFinal / 2, tamanhoFinal / 2, 0, Math.PI * 2);
          ctx.clip();
        }

        const ratio = tamanhoFinal / MOLDURA;
        const finalDisplayW = displayW * ratio;
        const finalDisplayH = displayH * ratio;
        const cx = tamanhoFinal / 2;
        const cy = tamanhoFinal / 2;
        const scaledW = finalDisplayW * imageState.scale;
        const scaledH = finalDisplayH * imageState.scale;
        const drawX = cx - scaledW / 2 + imageState.x * ratio;
        const drawY = cy - scaledH / 2 + imageState.y * ratio;

        ctx.drawImage(img, drawX, drawY, scaledW, scaledH);

        if (formatoSelecionado === 'redondo') ctx.restore();

        resolve(canvas.toDataURL('image/png', 0.95));
      });
    }

    // Salva dados do cliente no localStorage para reaproveitar no próximo pedido
    function salvarDadosCliente() {
      localStorage.setItem('cliente_nome', document.getElementById('cliente_nome').value.trim());
      localStorage.setItem('cliente_telefone', document.getElementById('cliente_telefone').value.trim());
      localStorage.setItem('barraca', document.getElementById('barraca').value);
    }

    // Restaura dados do cliente ao carregar a página
    function restaurarDadosCliente() {
      const nome = localStorage.getItem('cliente_nome');
      const tel = localStorage.getItem('cliente_telefone');
      const barraca = localStorage.getItem('barraca');
      if (nome) document.getElementById('cliente_nome').value = nome;
      if (tel) document.getElementById('cliente_telefone').value = tel;
      if (barraca) document.getElementById('barraca').value = barraca;
    }
    restaurarDadosCliente();

    async function enviarPedido(continuar) {
      const clienteNome = document.getElementById('cliente_nome').value.trim();
      const clienteTel = document.getElementById('cliente_telefone').value.trim();
      if (!clienteNome || !clienteTel) { alert('Preencha nome e telefone.'); return; }
      if (!imagemOriginal) { alert('Envie uma imagem primeiro.'); return; }

      const btn = document.getElementById(continuar ? 'btn-continuar' : 'btn-finalizar');
      btn.disabled = true;
      btn.innerText = '⏳ Processando...';

      try {
        const imagemRecortada = await recortarImagem();
        const pedido = {
          cliente_nome: clienteNome,
          cliente_telefone: clienteTel,
          barraca: document.getElementById('barraca').value,
          produto: document.getElementById('produto-select').value,
          formato: formato.value,
          tamanho: document.getElementById('tamanho').value,
          quantidade: parseInt(document.getElementById('quantidade').value, 10),
          imagem: imagemRecortada
        };

        const res = await fetch('/api/pedidos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pedido)
        });

        const data = await res.json();
        if (data.id) {
          salvarDadosCliente();
          alert(`Pedido enviado! Código: #${data.id}`);
          if (continuar) {
            // Reseta só a imagem e quantidade para o próximo pedido
            upload.value = '';
            imagemOriginal = null;
            previewImg.style.display = 'none';
            document.getElementById('quantidade').value = '1';
            window.location.href = '/';
          } else {
            window.location.href = '/carrinho.html';
          }
        } else {
          alert('Erro: ' + (data.error || 'desconhecido'));
        }
      } catch (err) {
        alert('Erro ao processar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = continuar ? '🛒 Finalizar e Continuar Comprando' : '✅ Finalizar Pedido';
      }
    }

    document.getElementById('btn-continuar').addEventListener('click', () => enviarPedido(true));
    btnFinalizar.addEventListener('click', () => enviarPedido(false));

    // FINALIZAR PEDIDO — envia JSON com base64 (mantido para compatibilidade)
    btnFinalizar.addEventListener('click', async () => {
      const clienteNome = document.getElementById('cliente_nome').value.trim();
      const clienteTel = document.getElementById('cliente_telefone').value.trim();
      if (!clienteNome || !clienteTel) { alert('Preencha nome e telefone.'); return; }
      if (!imagemOriginal) { alert('Envie uma imagem primeiro.'); return; }

      btnFinalizar.disabled = true;
      btnFinalizar.innerText = '⏳ Processando...';

      try {
        const imagemRecortada = await recortarImagem();

        const pedido = {
          cliente_nome: clienteNome,
          cliente_telefone: clienteTel,
          barraca: document.getElementById('barraca').value,
          produto: document.getElementById('produto-select').value,
          formato: formato.value,
          tamanho: document.getElementById('tamanho').value,
          quantidade: parseInt(document.getElementById('quantidade').value, 10),
          imagem: imagemRecortada // data URL com base64
        };

        const res = await fetch('/api/pedidos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pedido)
        });

        const data = await res.json();
        if (data.id) {
          alert(`Pedido enviado! Código: #${data.id}`);
          window.location.href = '/carrinho.html';
        } else {
          alert('Erro: ' + (data.error || 'desconhecido'));
        }
      } catch (err) {
        alert('Erro ao processar: ' + err.message);
      } finally {
        btnFinalizar.disabled = false;
        btnFinalizar.innerText = '✅ Finalizar Pedido';
      }
    });
  </script>
</body>
</html>
