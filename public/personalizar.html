<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalizar - AC Grafic</title>
  <style>
    :root {
      --primary: #2563eb; --primary-dark: #1d4ed8;
      --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #cbd5e1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { background: var(--primary); color: white; padding: 15px 0; }
    header .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 28px; }
    nav a { color: white; margin-left: 20px; text-decoration: none; font-weight: 500; padding: 6px 12px; border-radius: 6px; }
    nav a:hover { background: rgba(255,255,255,0.2); }
    h2 { margin: 30px 0 20px; }

    .config-wrap { display: flex; gap: 30px; flex-wrap: wrap; }
    .config-form { flex: 1; min-width: 300px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .preview-area { flex: 1; min-width: 300px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .form-group select, .form-group input {
      width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: white;
    }
    input[type="file"] { padding: 8px; }
    .btn-continuar {
      width: 100%; background: var(--primary); color: white; padding: 14px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s;
    }
    .btn-continuar:hover { background: var(--primary-dark); }

    /* Moldura de preview */
    #preview-moldura {
      background: #e2e8f0; padding: 15px; border-radius: 12px; display: flex;
      justify-content: center; align-items: center; margin-bottom: 16px;
    }
    #preview-moldura.redondo { border-radius: 50%; }
    #preview-moldura.quadrado { border-radius: 12px; }
    #preview-moldura .img-wrap {
      width: 200px; height: 200px; overflow: hidden; display: flex;
      justify-content: center; align-items: center; background: white; position: relative;
    }
    #preview-moldura.redondo .img-wrap { border-radius: 50%; }
    #preview-moldura.quadrado .img-wrap { border-radius: 12px; }
    #preview-moldura .img-wrap img { position: absolute; max-width: none; }

    .controles-zoom { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
    .controles-zoom input[type=range] { flex: 1; }
    .controles-zoom span { font-size: 13px; color: #64748b; min-width: 40px; text-align: center; }

    .info-produto { margin-top: 16px; font-size: 14px; color: #64748b; text-align: center; }

    @media (max-width: 768px) {
      header .container { flex-direction: column; gap: 10px; }
      nav a { margin: 0 5px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>🎨 AC Grafic</h1>
      <nav>
        <a href="/">Início</a>
        <a href="/carrinho.html">Meus Pedidos</a>
        <a href="/painel.html">Painel da Barraca</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>🖼️ Personalizar seu Botton</h2>

    <div class="config-wrap">
      <!-- Configurações -->
      <div class="config-form">
        <div class="form-group">
          <label>Cliente (nome)</label>
          <input type="text" id="cliente-nome" placeholder="Seu nome">
        </div>
        <div class="form-group">
          <label>Telefone (WhatsApp)</label>
          <input type="text" id="cliente-telefone" placeholder="(16) 99999-9999">
        </div>
        <div class="form-group">
          <label>Barraca</label>
          <select id="barraca">
            <option value="Barraca 1">Barraca 1</option>
            <option value="Barraca 2">Barraca 2</option>
            <option value="Barraca 3">Barraca 3</option>
          </select>
        </div>
        <div class="form-group">
          <label>Produto</label>
          <select id="produto" onchange="atualizarFormato()">
            <option value="Botton Redondo">Botton Redondo</option>
            <option value="Botton Quadrado">Botton Quadrado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Formato</label>
          <input type="text" id="formato" readonly>
        </div>
        <div class="form-group">
          <label>Tamanho</label>
          <input type="text" id="tamanho" readonly>
        </div>
        <div class="form-group">
          <label>Quantidade</label>
          <input type="number" id="quantidade" value="1" min="1">
        </div>
        <div class="form-group">
          <label>Imagem (PNG/JPG)</label>
          <input type="file" id="imagem-file" accept="image/*" onchange="carregarImagem(event)">
        </div>
        <button class="btn-continuar" onclick="enviarPedido()">🛒 Enviar Pedido</button>
      </div>

      <!-- Preview -->
      <div class="preview-area">
        <h3 style="margin-bottom: 12px;">Pré-visualização</h3>
        <div id="preview-moldura" class="redondo">
          <div class="img-wrap" id="img-wrap">
            <img id="preview-img" src="" alt="Preview" style="display:none;">
          </div>
        </div>
        <div class="controles-zoom" id="zoom-area" style="display:none;">
          <span>−</span>
          <input type="range" id="zoom-slider" min="1" max="3" step="0.05" value="1" oninput="aplicarZoom()">
          <span>+</span>
        </div>
        <button style="margin-top:12px; padding:8px 16px; border:1px solid var(--border); border-radius:6px; background:white; cursor:pointer; display:none;" id="btn-remover" onclick="removerImagem()">❌ Remover imagem</button>
        <p class="info-produto" id="info-produto"></p>
      </div>
    </div>
  </main>

  <script>
    let zoomAtual = 1;
    let imagemDataUrl = null;

    function atualizarFormato() {
      const produto = document.getElementById('produto').value;
      const formato = document.getElementById('formato');
      const tamanho = document.getElementById('tamanho');
      const moldura = document.getElementById('preview-moldura');

      if (produto === 'Botton Quadrado') {
        formato.value = 'Quadrado';
        tamanho.value = '5x5 cm';
        moldura.classList.remove('redondo');
        moldura.classList.add('quadrado');
      } else {
        formato.value = 'Redondo';
        tamanho.value = '3,5x3,5 cm';
        moldura.classList.remove('quadrado');
        moldura.classList.add('redondo');
      }

      document.getElementById('info-produto').textContent =
        `${produto} — ${formato.value} • ${tamanho.value}`;
    }

    function carregarImagem(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        imagemDataUrl = e.target.result;
        const img = document.getElementById('preview-img');
        img.src = imagemDataUrl;
        img.style.display = 'block';
        zoomAtual = 1;
        document.getElementById('zoom-slider').value = 1;
        aplicarZoom();
        document.getElementById('zoom-area').style.display = 'flex';
        document.getElementById('btn-remover').style.display = 'inline-block';
      };
      reader.readAsDataURL(file);
    }

    function aplicarZoom() {
      zoomAtual = parseFloat(document.getElementById('zoom-slider').value);
      const img = document.getElementById('preview-img');
      img.style.width = (200 * zoomAtual) + 'px';
      img.style.height = (200 * zoomAtual) + 'px';
    }

    function removerImagem() {
      imagemDataUrl = null;
      const img = document.getElementById('preview-img');
      img.src = '';
      img.style.display = 'none';
      document.getElementById('zoom-area').style.display = 'none';
      document.getElementById('btn-remover').style.display = 'none';
      document.getElementById('imagem-file').value = '';
    }

    async function enviarPedido() {
      const cliente_nome = document.getElementById('cliente-nome').value.trim();
      const cliente_telefone = document.getElementById('cliente-telefone').value.trim();
      const barraca = document.getElementById('barraca').value;
      const produto = document.getElementById('produto').value;
      const formato = document.getElementById('formato').value;
      const tamanho = document.getElementById('tamanho').value;
      const quantidade = parseInt(document.getElementById('quantidade').value) || 1;

      if (!cliente_nome || !cliente_telefone) { alert('Preencha nome e telefone'); return; }
      if (!imagemDataUrl) { alert('Escolha uma imagem'); return; }

      try {
        const res = await fetch('/api/pedidos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cliente_nome, cliente_telefone, barraca, produto, formato,
            tamanho, quantidade, imagem: imagemDataUrl
          })
        });
        const data = await res.json();
        if (res.ok) {
          alert('✅ Pedido enviado com sucesso!');
          window.location.href = '/carrinho.html?tel=' + encodeURIComponent(cliente_telefone);
        } else {
          alert('Erro: ' + data.error);
        }
      } catch (err) {
        alert('Erro ao enviar pedido: ' + err.message);
      }
    }

    // Inicializa
    atualizarFormato();
  </script>
</body>
</html>
