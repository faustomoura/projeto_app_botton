<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalizar - AC Grafic</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #dbeafe;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #10b981;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

    /* ===== HEADER ===== */
    header {
      background: var(--primary);
      color: white;
      padding: 18px 0;
      box-shadow: var(--shadow);
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      transition: background 0.2s;
      font-size: 15px;
    }

    nav a:hover { background: rgba(255, 255, 255, 0.2); }

    .carrinho-badge {
      background: var(--danger);
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      margin-left: 4px;
    }

    /* ===== LAYOUT ===== */
    .personalizar-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 30px;
      padding: 30px 0;
      align-items: start;
    }

    @media (max-width: 900px) {
      .personalizar-layout { grid-template-columns: 1fr; }
    }

    /* ===== PREVIEW ===== */
    .preview-area {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .preview-area h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: var(--text);
    }

    #canvas-preview {
      max-width: 100%;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #f1f5f9;
    }

    /* ===== FORMULÁRIO ===== */
    .form-area {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .form-area h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--card);
      color: var(--text);
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .form-group input[type="range"] {
      padding: 0;
      border: none;
    }

    .form-group input[type="file"] {
      padding: 8px;
      cursor: pointer;
    }

    .btn {
      display: inline-block;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      width: 100%;
      text-align: center;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-success {
      background: var(--success);
      color: white;
    }

    .btn-success:hover { background: #059669; }

    .btn-secondary {
      background: #64748b;
      color: white;
    }

    .btn-secondary:hover { background: #475569; }

    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-outline:hover {
      background: var(--primary-light);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
      padding: 6px 12px;
      font-size: 13px;
      width: auto;
    }

    .btn-danger:hover { background: #b91c1c; }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    /* ===== CARRINHO ===== */
    .carrinho-area {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-top: 20px;
    }

    .carrinho-area h3 {
      font-size: 18px;
      margin-bottom: 16px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .carrinho-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      background: var(--bg);
    }

    .carrinho-item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid var(--primary);
    }

    .carrinho-item-info {
      flex: 1;
      font-size: 13px;
    }

    .carrinho-item-info strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .carrinho-item-info span {
      color: var(--text-light);
    }

    .carrinho-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 0;
      border-top: 2px solid var(--border);
      margin-top: 10px;
      font-size: 16px;
      font-weight: 700;
    }

    .carrinho-total strong {
      color: var(--primary);
      font-size: 20px;
    }

    .carrinho-vazio {
      text-align: center;
      color: var(--text-light);
      padding: 20px;
      font-size: 14px;
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--text);
      color: white;
      padding: 30px 20px;
      text-align: center;
      margin-top: 40px;
    }

    footer p {
      font-size: 14px;
      opacity: 0.8;
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--success);
      color: white;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
      z-index: 9999;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.error {
      background: var(--danger);
    }

    @media (max-width: 768px) {
      header .container { flex-direction: column; }
      nav { justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="logo">🎨 AC Grafic</div>
      <nav>
        <a href="/">Início</a>
        <a href="/carrinho.html">Meus Pedidos <span class="carrinho-badge" id="badge-carrinho">0</span></a>
        <a href="/painel.html">Painel da Barraca</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="personalizar-layout">
      <!-- PREVIEW -->
      <div class="preview-area">
        <h2>👁️ Pré-visualização</h2>
        <canvas id="canvas-preview" width="400" height="400"></canvas>
      </div>

      <!-- FORMULÁRIO -->
      <div class="form-area">
        <h2>📝 Dados do Produto</h2>

        <div class="form-group">
          <label>📤 Enviar imagem:</label>
          <input type="file" id="input-imagem" accept="image/*">
        </div>

        <div class="form-group">
          <label>⚠️ Formato:</label>
          <select id="select-formato">
            <option value="redondo">Redondo</option>
            <option value="quadrado">Quadrado</option>
          </select>
        </div>

        <div class="form-group">
          <label>📏 Tamanho:</label>
          <select id="select-tamanho">
            <option value="3.5x3.5">3,5 x 3,5 cm</option>
            <option value="5x5">5,0 x 5,0 cm</option>
            <option value="7x7">7,0 x 7,0 cm</option>
          </select>
        </div>

        <div class="form-group">
          <label>🔢 Quantidade:</label>
          <input type="number" id="input-quantidade" min="1" value="1">
        </div>

        <div class="form-group">
          <label>🏪 Selecione a barraca:</label>
          <select id="select-barraca">
            <option value="Barraca 1">Barraca 1</option>
            <option value="Barraca 2">Barraca 2</option>
            <option value="Barraca 3">Barraca 3</option>
          </select>
        </div>

        <div class="form-group">
          <label>👤 Seu nome:</label>
          <input type="text" id="input-nome" placeholder="Seu nome completo">
        </div>

        <div class="form-group">
          <label>📱 Telefone:</label>
          <input type="tel" id="input-telefone" placeholder="(00) 00000-0000">
        </div>

        <div class="form-group">
          <label>🔍 Zoom:</label>
          <input type="range" id="input-zoom" min="0.5" max="3" step="0.1" value="1">
        </div>

        <div class="btn-group">
          <button class="btn btn-secondary" onclick="resetarPosicao()">🔄 Resetar Posição</button>
          <button class="btn btn-outline" onclick="adicionarCarrinho()">🛒 Adicionar + Continuar Comprando</button>
          <button class="btn btn-success" onclick="finalizarPedido()">✅ Finalizar Pedido</button>
        </div>
      </div>
    </div>

    <!-- CARRINHO -->
    <div class="carrinho-area">
      <h3>🛒 Carrinho <span id="badge-carrinho2" style="background:var(--danger);color:white;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;">0</span></h3>
      <div id="lista-carrinho">
        <p class="carrinho-vazio">Seu carrinho está vazio. Adicione produtos para começar.</p>
      </div>
      <div class="carrinho-total" id="carrinho-total" style="display:none;">
        <span>Total de itens:</span>
        <strong id="total-itens">0</strong>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 AC Grafic — Bottons e chaveiros personalizados com qualidade</p>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    // ===== ESTADO =====
    let carrinho = JSON.parse(localStorage.getItem('carrinho_acgrafic') || '[]');
    let imagemAtual = null;
    let imagemBase64 = null;
    let zoom = 1;
    let offsetX = 0;
    let offsetY = 0;
    let dragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    // ===== INICIALIZAÇÃO =====
    document.addEventListener('DOMContentLoaded', () => {
      atualizarBadge();
      renderizarCarrinho();
      atualizarPreview();

      document.getElementById('input-imagem').addEventListener('change', carregarImagem);
      document.getElementById('select-formato').addEventListener('change', atualizarPreview);
      document.getElementById('select-tamanho').addEventListener('change', atualizarPreview);
      document.getElementById('input-zoom').addEventListener('input', (e) => {
        zoom = parseFloat(e.target.value);
        atualizarPreview();
      });

      const canvas = document.getElementById('canvas-preview');
      canvas.addEventListener('mousedown', iniciarDrag);
      canvas.addEventListener('mousemove', moverDrag);
      canvas.addEventListener('mouseup', pararDrag);
      canvas.addEventListener('mouseleave', pararDrag);
      canvas.addEventListener('touchstart', iniciarDragTouch, { passive: false });
      canvas.addEventListener('touchmove', moverDragTouch, { passive: false });
      canvas.addEventListener('touchend', pararDrag);
    });

    // ===== IMAGEM =====
    function carregarImagem(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        imagemBase64 = ev.target.result;
        const img = new Image();
        img.onload = () => {
          imagemAtual = img;
          zoom = 1;
          offsetX = 0;
          offsetY = 0;
          document.getElementById('input-zoom').value = 1;
          atualizarPreview();
        };
        img.src = imagemBase64;
      };
      reader.readAsDataURL(file);
    }

    // ===== PREVIEW =====
    function atualizarPreview() {
      const canvas = document.getElementById('canvas-preview');
      const ctx = canvas.getContext('2d');
      const formato = document.getElementById('select-formato').value;

      canvas.width = 400;
      canvas.height = 400;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f1f5f9';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!imagemAtual) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '16px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('Envie uma imagem para pré-visualizar', 200, 200);
        return;
      }

      const tamanho = formato === 'redondo' ? 300 : 300;
      const cx = 200 + offsetX;
      const cy = 200 + offsetY;

      ctx.save();

      if (formato === 'redondo') {
        ctx.beginPath();
        ctx.arc(cx, cy, tamanho / 2, 0, Math.PI * 2);
        ctx.clip();
      } else {
        const raio = 20;
        ctx.beginPath();
        ctx.moveTo(cx - tamanho/2 + raio, cy - tamanho/2);
        ctx.lineTo(cx + tamanho/2 - raio, cy - tamanho/2);
        ctx.arcTo(cx + tamanho/2, cy - tamanho/2, cx + tamanho/2, cy - tamanho/2 + raio, raio);
        ctx.lineTo(cx + tamanho/2, cy + tamanho/2 - raio);
        ctx.arcTo(cx + tamanho/2, cy + tamanho/2, cx + tamanho/2 - raio, cy + tamanho/2, raio);
        ctx.lineTo(cx - tamanho/2 + raio, cy + tamanho/2);
        ctx.arcTo(cx - tamanho/2, cy + tamanho/2, cx - tamanho/2, cy + tamanho/2 - raio, raio);
        ctx.lineTo(cx - tamanho/2, cy - tamanho/2 + raio);
        ctx.arcTo(cx - tamanho/2, cy - tamanho/2, cx - tamanho/2 + raio, cy - tamanho/2, raio);
        ctx.closePath();
        ctx.clip();
      }

      const escala = Math.min(tamanho / imagemAtual.width, tamanho / imagemAtual.height) * zoom;
      const imgW = imagemAtual.width * escala;
      const imgH = imagemAtual.height * escala;

      ctx.drawImage(imagemAtual, cx - imgW / 2, cy - imgH / 2, imgW, imgH);
      ctx.restore();

      // Borda
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 3;
      if (formato === 'redondo') {
        ctx.beginPath();
        ctx.arc(cx, cy, tamanho / 2, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        const raio = 20;
        ctx.beginPath();
        ctx.moveTo(cx - tamanho/2 + raio, cy - tamanho/2);
        ctx.lineTo(cx + tamanho/2 - raio, cy - tamanho/2);
        ctx.arcTo(cx + tamanho/2, cy - tamanho/2, cx + tamanho/2, cy - tamanho/2 + raio, raio);
        ctx.lineTo(cx + tamanho/2, cy + tamanho/2 - raio);
        ctx.arcTo(cx + tamanho/2, cy + tamanho/2, cx + tamanho/2 - raio, cy + tamanho/2, raio);
        ctx.lineTo(cx - tamanho/2 + raio, cy + tamanho/2);
        ctx.arcTo(cx - tamanho/2, cy + tamanho/2, cx - tamanho/2, cy + tamanho/2 - raio, raio);
        ctx.lineTo(cx - tamanho/2, cy - tamanho/2 + raio);
        ctx.arcTo(cx - tamanho/2, cy - tamanho/2, cx - tamanho/2 + raio, cy - tamanho/2, raio);
        ctx.closePath();
        ctx.stroke();
      }
    }

    // ===== DRAG =====
    function iniciarDrag(e) {
      dragging = true;
      dragStartX = e.offsetX - offsetX;
      dragStartY = e.offsetY - offsetY;
    }

    function moverDrag(e) {
      if (!dragging) return;
      offsetX = e.offsetX - dragStartX;
      offsetY = e.offsetY - dragStartY;
      atualizarPreview();
    }

    function pararDrag() { dragging = false; }

    function iniciarDragTouch(e) {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = e.target.getBoundingClientRect();
      dragging = true;
      dragStartX = touch.clientX - rect.left - offsetX;
      dragStartY = touch.clientY - rect.top - offsetY;
    }

    function moverDragTouch(e) {
      e.preventDefault();
      if (!dragging) return;
      const touch = e.touches[0];
      const rect = e.target.getBoundingClientRect();
      offsetX = touch.clientX - rect.left - dragStartX;
      offsetY = touch.clientY - rect.top - dragStartY;
      atualizarPreview();
    }

    function resetarPosicao() {
      offsetX = 0;
      offsetY = 0;
      zoom = 1;
      document.getElementById('input-zoom').value = 1;
      atualizarPreview();
    }

    // ===== CARRINHO =====
    function adicionarCarrinho() {
      if (!imagemBase64) {
        mostrarToast('Envie uma imagem primeiro!', true);
        return;
      }

      const item = {
        produto: document.getElementById('select-formato').value === 'redondo' ? 'Botton Redondo' : 'Botton Quadrado',
        formato: document.getElementById('select-formato').value,
        tamanho: document.getElementById('select-tamanho').value,
        quantidade: parseInt(document.getElementById('input-quantidade').value) || 1,
        barraca: document.getElementById('select-barraca').value,
        cliente_nome: document.getElementById('input-nome').value.trim(),
        cliente_telefone: document.getElementById('input-telefone').value.trim(),
        imagem: imagemBase64,
        zoom: zoom,
        offsetX: offsetX,
        offsetY: offsetY
      };

      if (!item.cliente_nome || !item.cliente_telefone) {
        mostrarToast('Preencha nome e telefone!', true);
        return;
      }

      carrinho.push(item);
      salvarCarrinho();
      renderizarCarrinho();
      atualizarBadge();
      mostrarToast('✅ Adicionado ao carrinho! Continue comprando.');

      // Limpar formulário para próximo produto
      document.getElementById('input-imagem').value = '';
      document.getElementById('input-quantidade').value = '1';
      imagemAtual = null;
      imagemBase64 = null;
      zoom = 1;
      offsetX = 0;
      offsetY = 0;
      document.getElementById('input-zoom').value = 1;
      atualizarPreview();
    }

    function removerItem(index) {
      carrinho.splice(index, 1);
      salvarCarrinho();
      renderizarCarrinho();
      atualizarBadge();
    }

    function salvarCarrinho() {
      localStorage.setItem('carrinho_acgrafic', JSON.stringify(carrinho));
    }

    function renderizarCarrinho() {
      const lista = document.getElementById('lista-carrinho');
      const totalDiv = document.getElementById('carrinho-total');
      const totalItens = document.getElementById('total-itens');

      if (carrinho.length === 0) {
        lista.innerHTML = '<p class="carrinho-vazio">Seu carrinho está vazio. Adicione produtos para começar.</p>';
        totalDiv.style.display = 'none';
        return;
      }

      totalDiv.style.display = 'flex';
      const total = carrinho.reduce((s, i) => s + i.quantidade, 0);
      totalItens.textContent = total;

      lista.innerHTML = carrinho.map((item, i) => `
        <div class="carrinho-item">
          <img src="${item.imagem}" alt="${item.produto}">
          <div class="carrinho-item-info">
            <strong>${item.produto}</strong>
            <span>${item.tamanho} cm · Qtd: ${item.quantidade} · ${item.barraca}</span><br>
            <span>👤 ${item.cliente_nome} · 📱 ${item.cliente_telefone}</span>
          </div>
          <button class="btn btn-danger" onclick="removerItem(${i})">✕ Remover</button>
        </div>
      `).join('');
    }

    function atualizarBadge() {
      const total = carrinho.reduce((s, i) => s + i.quantidade, 0);
      document.getElementById('badge-carrinho').textContent = total;
      document.getElementById('badge-carrinho2').textContent = total;
    }

    // ===== FINALIZAR =====
    async function finalizarPedido() {
      if (carrinho.length === 0) {
        mostrarToast('Adicione pelo menos 1 item ao carrinho!', true);
        return;
      }

      const btn = event.target;
      btn.textContent = '⏳ Enviando...';
      btn.disabled = true;

      let sucesso = 0;
      let falha = 0;

      for (const item of carrinho) {
        try {
          const res = await fetch('/api/pedidos', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              produto: item.produto,
              formato: item.formato,
              tamanho: item.tamanho,
              quantidade: item.quantidade,
              barraca: item.barraca,
              cliente_nome: item.cliente_nome,
              cliente_telefone: item.cliente_telefone,
              imagem: item.imagem
            })
          });

          if (res.ok) sucesso++;
          else falha++;
        } catch (err) {
          falha++;
        }
      }

      btn.textContent = '✅ Finalizar Pedido';
      btn.disabled = false;

      if (falha === 0) {
        mostrarToast(`✅ ${sucesso} pedido(s) enviado(s) com sucesso!`);
        carrinho = [];
        salvarCarrinho();
        renderizarCarrinho();
        atualizarBadge();
        setTimeout(() => { window.location.href = '/carrinho.html'; }, 1500);
      } else {
        mostrarToast(`⚠️ ${sucesso} enviado(s), ${falha} falhou(aram).`, true);
      }
    }

    // ===== TOAST =====
    function mostrarToast(msg, erro = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show' + (erro ? ' error' : '');
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }
  </script>
</body>
</html>
