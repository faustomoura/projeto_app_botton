<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Pedidos - AC Grafic</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>🎨 AC Grafic</h1>
      <nav>
        <a href="/">Início</a>
        <a href="/carrinho.html">Meus Pedidos</a>
        <a href="/painel.html">Painel da Barraca</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Meus Pedidos</h2>
    <div id="lista-pedidos-cliente"></div>
  </main>

  <script>
    async function carregarPedidos() {
      const telefone = localStorage.getItem('telefone_cliente');
      if (!telefone) {
        document.getElementById('lista-pedidos-cliente').innerHTML =
          '<p>Informe seu telefone para acompanhar os pedidos.</p>' +
          '<input type="text" id="tel-busca" placeholder="(XX) XXXXX-XXXX">' +
          '<button onclick="buscarPedidos()">Buscar</button>';
        return;
      }
      buscarPedidos(telefone);
    }

    async function buscarPedidos(tel) {
      const telefone = tel || document.getElementById('tel-busca').value;
      localStorage.setItem('telefone_cliente', telefone);
      const res = await fetch('/api/pedidos');
      const pedidos = await res.json();
      const meus = pedidos.filter(p => p.cliente_telefone === telefone);

      const div = document.getElementById('lista-pedidos-cliente');
      if (meus.length === 0) {
        div.innerHTML = '<p>Nenhum pedido encontrado.</p>';
        return;
      }

      div.innerHTML = meus.map(p => `
        <div class="pedido-card">
          <img src="/uploads/${p.imagem}" alt="Pedido">
          <div>
            <p><strong>${p.produto}</strong> - ${p.formato} - ${p.tamanho}</p>
            <p>Quantidade: ${p.quantidade}</p>
            <p>Barraca: ${p.barraca}</p>
            <p>Status: <span class="status ${p.status}">${p.status}</span></p>
          </div>
        </div>
      `).join('');
    }

    carregarPedidos();
  </script>
</body>
</html>
